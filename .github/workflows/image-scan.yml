name: Image Quality & Security Scan

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  scan:
    name: Build & Scan Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build temporary Docker image
        run: docker build -t temp-image:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'temp-image:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # --- NOTIFICATIONS ON FAILURE ---
      - name: Notify Discord on Failure
        if: failure()
        run: curl -H "Content-Type: application/json" -d '{"content": "❌ **Failure**: `${{ github.workflow }}` failed in `${{ github.repository }}`. Check image vulnerabilities!"}' ${{ secrets.DISCORD_WEBHOOK }}
      - name: Notify Slack on Failure
        if: failure()
        run: curl -X POST -H 'Content-type: application/json' --data '{"text":"❌ *Failure*: `${{ github.workflow }}` failed. Check image vulnerabilities!"}' ${{ secrets.SLACK_WEBHOOK }}
      - name: Notify WhatsApp on Failure
        if: failure()
        run: |
          curl -X POST https://api.twilio.com/2010-04-01/Accounts/${{ secrets.TWILIO_ACCOUNT_SID }}/Messages.json \
          --data-urlencode "From=whatsapp:${{ secrets.TWILIO_WHATSAPP_NUMBER }}" \
          --data-urlencode "To=whatsapp:${{ secrets.YOUR_WHATSAPP_NUMBER }}" \
          --data-urlencode "Body=❌ Failure: ${{ github.workflow }} failed. Check image vulnerabilities!" \
          -u ${{ secrets.TWILIO_ACCOUNT_SID }}:${{ secrets.TWILIO_AUTH_TOKEN }}
